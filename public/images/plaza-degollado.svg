<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Teatro Degollado, Guadalajara">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky4)"/>
  <!-- Building body -->
  <rect x="200" y="250" width="800" height="500" fill="#efebe9"/>
  <!-- Corinthian columns -->
  <g fill="#bcaaa4">
    <rect x="240" y="380" width="40" height="370"/>
    <rect x="320" y="380" width="40" height="370"/>
    <rect x="400" y="380" width="40" height="370"/>
    <rect x="480" y="380" width="40" height="370"/>
    <rect x="560" y="380" width="40" height="370"/>
    <rect x="640" y="380" width="40" height="370"/>
    <rect x="720" y="380" width="40" height="370"/>
    <rect x="800" y="380" width="40" height="370"/>
    <rect x="880" y="380" width="40" height="370"/>
    <rect x="960" y="380" width="40" height="370"/>
  </g>
  <!-- Pediment -->
  <polygon points="200,250 600,80 1000,250" fill="#8d6e63"/>
  <polygon points="260,250 600,140 940,250" fill="#a1887f"/>
  <!-- Roof line -->
  <rect x="200" y="250" width="800" height="30" fill="#5d4037"/>
  <rect x="200" y="350" width="800" height="30" fill="#5d4037"/>
  <!-- Steps -->
  <g fill="#bcaaa4">
    <rect x="180" y="750" width="840" height="20"/>
    <rect x="160" y="770" width="880" height="20"/>
  </g>
  <text x="60" y="50" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#3e2723">Teatro Degollado</text>
</svg>