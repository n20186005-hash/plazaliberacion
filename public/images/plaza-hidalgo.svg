<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Estatua de Miguel Hidalgo en la Plaza de la Liberación">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#a1887f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky3)"/>
  <!-- Pedestal -->
  <rect x="500" y="600" width="200" height="160" fill="#5d4037"/>
  <rect x="510" y="610" width="180" height="20" fill="#795548"/>
  <rect x="510" y="650" width="180" height="20" fill="#795548"/>
  <rect x="510" y="690" width="180" height="20" fill="#795548"/>
  <!-- Statue -->
  <g fill="#3e2723">
    <rect x="585" y="400" width="30" height="200"/>
    <circle cx="600" cy="380" r="36"/>
    <rect x="560" y="420" width="80" height="20"/>
    <rect x="540" y="440" width="120" height="10"/>
  </g>
  <!-- Inscription plaque -->
  <rect x="540" y="720" width="120" height="20" fill="#d7ccc8"/>
  <text x="600" y="735" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#3e2723">Miguel Hidalgo · 1810</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#3e2723">Estatua de Miguel Hidalgo</text>
</svg>